name: dev-toolbox

x-logging: &production-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  gateway:
    image: dev-toolbox-gateway:${APP_VERSION:?请配置明确的 APP_VERSION}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请配置正式域名}
      # Agent Console relay 上游;内部令牌经 Secret 文件由 gateway 入口脚本注入 Caddy。
      # relay 与本网关同网(dev-toolbox_frontend),以网络别名 agent-console-relay 暴露,
      # 内部监听 8081(agent-console compose 生产 overlay 负责 alias 与端口)。
      AGENT_CONSOLE_RELAY_UPSTREAM: ${AGENT_CONSOLE_RELAY_UPSTREAM:-agent-console-relay:8081}
    secrets:
      - agent_console_internal_token
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ${DEPLOY_CONFIG_ROOT:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_DATA_ROOT:-./data}/caddy:/data:rw
      - ${DEPLOY_DATA_ROOT:-./data}/caddy-config:/config:rw
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    logging: *production-logging

  api:
    image: dev-toolbox-api:${APP_VERSION:?请配置明确的 APP_VERSION}
    user: "10001:10001"
    group_add: ["20000"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1700,uid=10001,gid=10001
    command: ["sh", "-c", "/app/migrate && exec /app/server"]
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?请配置 POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?请配置 POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGSSLMODE: disable
      APP_ORIGIN: https://${APP_DOMAIN:?请配置正式域名}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      ATTACHMENT_ROOT: /data
      ARTIFACT_SCHEMA_PATH: /app/contracts/ai-artifact.schema.json
      MIGRATIONS_PATH: /app/migrations
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      AGENT_CONSOLE_INTERNAL_TOKEN_FILE: /run/secrets/agent_console_internal_token
      ALLOW_INSECURE_PROVIDER_HTTP: "false"
      AI_WORKER_URL: http://ai-worker:3001
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      APP_VERSION: ${APP_VERSION:?请配置明确的 APP_VERSION}
      OPERATIONS_STATUS_ROOT: /operations
    secrets:
      - postgres_password
      - internal_service_token
      - agent_console_internal_token
      - app_master_key
    volumes:
      - ${DEPLOY_DATA_ROOT:-./data}/attachments:/data:rw
      - ${DEPLOY_DATA_ROOT:-./data}/operations:/operations:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]
    logging: *production-logging

  ai-worker:
    image: dev-toolbox-ai-worker:${APP_VERSION:?请配置明确的 APP_VERSION}
    dns: [223.5.5.5]
    user: "1000:1000"
    group_add: ["20000"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1700,uid=1000,gid=1000
    environment:
      WORKER_ADDRESS: 0.0.0.0:3001
      ARTIFACT_SCHEMA_PATH: /app/contracts/ai-artifact.schema.json
      PROMPT_ROOT: /app/prompts
      API_INTERNAL_URL: http://api:8080
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      ALLOW_INSECURE_PROVIDER_HTTP: "false"
    secrets: [internal_service_token]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, egress]
    logging: *production-logging

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请配置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请配置 POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - ${DEPLOY_DATA_ROOT:-./data}/postgres:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    networks: [backend]
    logging: *production-logging

  # Agent Console Relay 由 agent-console 仓库交付,不加入本 compose(部署契约
  # 检查要求固定四个长期服务)。接入时以 external 方式加入 frontend 网络(实际
  # 网络名 dev-toolbox_frontend)并设置网络别名 agent-console-relay(见
  # agent-console compose 生产 overlay):接收网关 /agent-console/* 反代并回调
  # http://api:8080 的 /internal/agent-console/*(Bearer 令牌),挂载
  # agent_console_internal_token Secret,上游地址与 AGENT_CONSOLE_RELAY_UPSTREAM
  # (默认 agent-console-relay:8081)一致;自有 PostgreSQL 独立部署,不接入
  # 本仓库 backend 网络。
  # relay:
  #   image: agent-console-relay:${APP_VERSION}
  #   networks: [frontend]
  #   secrets: [agent_console_internal_token]

networks:
  frontend:
    internal: false
  backend:
    internal: true
  egress:
    internal: false

secrets:
  postgres_password:
    file: ${DEPLOY_SECRETS_ROOT:-./secrets}/postgres_password
  internal_service_token:
    file: ${DEPLOY_SECRETS_ROOT:-./secrets}/internal_service_token
  agent_console_internal_token:
    file: ${DEPLOY_SECRETS_ROOT:-./secrets}/agent_console_internal_token
  app_master_key:
    file: ${DEPLOY_SECRETS_ROOT:-./secrets}/app_master_key
